name: DB backup (nightly, encrypted)
# Nightly pg_dump of production, encrypted with a passphrase before upload (the repo is public).
# Secrets (set by the owner): BACKUP_DATABASE_URL (direct/unpooled postgres:// URL; falls back to TARGET_DATABASE_URL (Neon), then SOURCE_DATABASE_URL), BACKUP_PASSPHRASE (long random string).
# Restore: download the artifact, then
#   gpg --batch --pinentry-mode loopback --passphrase "<passphrase>" -d nazlawi-*.dump.gpg > db.dump
#   pg_restore --dbname="<new database url>" --no-owner --no-privileges db.dump
on:
  schedule:
    - cron: "15 0 * * *" # 03:15 Asia/Riyadh / 02:15 Cairo
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB: ${{ secrets.BACKUP_DATABASE_URL || secrets.TARGET_DATABASE_URL || secrets.SOURCE_DATABASE_URL }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Normalize connection strings (strip quotes / NAME= prefix pasted from .env)
        run: |
          clean() { v="$(printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]*(export[[:space:]]+)?[A-Z_]+=//; s/^[[:space:]]*["'"'"']?//; s/["'"'"']?[[:space:]]*$//')"; printf '%s' "$v"; }
          v="$(clean "$DB")"; echo "::add-mask::$v"; echo "DB=$v" >> "$GITHUB_ENV"
      - name: Check secrets
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "::warning::BACKUP_DATABASE_URL (or SOURCE_DATABASE_URL) / BACKUP_PASSPHRASE not set; skipping"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
          if [ -n "$PASS" ] && [ ${#PASS} -lt 20 ]; then echo "::error::BACKUP_PASSPHRASE must be at least 20 characters"; exit 1; fi
      - name: Install PostgreSQL 18 client (works with 17 and 18 servers)
        if: env.SKIP != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Dump + encrypt (plaintext never leaves the runner)
        if: env.SKIP != '1'
        run: |
          umask 077; mkdir -p /tmp/out
          f="nazlawi-$(date -u +%Y%m%dT%H%MZ).dump"
          pg_dump "$DB" --format=custom --schema=public --no-owner --no-privileges --file="/tmp/$f"
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "/tmp/out/$f.gpg" "/tmp/$f"
          shred -u "/tmp/$f"
          ls -la /tmp/out | awk 'NR>1{print $5, $9}'
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: db-backup-${{ github.run_id }}
          path: /tmp/out/*.gpg
          retention-days: 60
          if-no-files-found: error
